<!-- Loading bar -->
<mg-loading-bar></mg-loading-bar>

<!-- Nabani shell: 92px brand sidebar + main column -->
<div class="nabani-shell">

  <!-- Sidebar (92px, brand, sticky full height) -->
  <aside class="nabani-sidebar">
    <!-- Logo 44px r12 -->
    <img
      class="nabani-logo"
      src="assets/images/logo/nabani-logo.png"
      alt="Nabani">

    <!-- Section nav -->
    <nav class="nabani-nav">
      @for (item of navigation(); track item.id) {
        <a
          class="nb-nav-item"
          [routerLink]="item.link"
          routerLinkActive="nb-nav-active"
          [attr.aria-label]="item.title">
          <mat-icon class="icon-size-[21px]" [svgIcon]="item.icon ?? ''"></mat-icon>
          <span>{{ item.title }}</span>
        </a>
      }
    </nav>
  </aside>

  <!-- Main column -->
  <div class="nabani-col">

    <!-- Topbar (60px, card, sticky) -->
    <header class="nabani-topbar">
      <!-- Global search (stub → opens Búsqueda global modal later) -->
      <button type="button" class="nb-search" (click)="openSearch()">
        <mat-icon class="icon-size-[17px]" [svgIcon]="'heroicons_outline:magnifying-glass'"></mat-icon>
        <span>Buscar pacientes, ventas…</span>
      </button>

      <div class="flex-1"></div>

      <!-- Notifications -->
      <button type="button" class="nb-iconbtn" aria-label="Notificaciones">
        <mat-icon class="icon-size-[21px]" [svgIcon]="'heroicons_outline:bell'"></mat-icon>
        <span class="nb-dot"></span>
      </button>

      <!-- User block -->
      <user></user>
    </header>

    <!-- Page content -->
    <main class="nabani-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Global Alert -->
@if (alertConfig(); as alert) {
  <mg-alert
    class="absolute bottom-0 left-1/2 transform -translate-x-1/2 nb-noprint"
    [appearance]="alert.appearance"
    [dismissible]="alert.dismissible"
    [showIcon]="alert.showIcon"
    [name]="alert.name"
    [type]="alert.type">
    {{ alert.message }}
  </mg-alert>
}
