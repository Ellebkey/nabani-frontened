<mg-modal-shell [title]="modalTitle()" (closed)="onCancel()">
  <form class="flex flex-col gap-3.5 p-5" [formGroup]="accountForm" (ngSubmit)="onSubmit()">
    <div class="grid grid-cols-2 gap-2.5">
      <div>
        <label class="mb-1.5 block text-[12.5px] font-semibold text-ink-2">Nombre *</label>
        <label
          class="flex h-10 items-center gap-2 rounded-field border border-line-strong bg-surface px-3 text-[14px] text-ink focus-within:border-brand focus-within:ring-[3px] focus-within:ring-brand/15">
          <mat-icon class="icon-size-4 text-ink-3" [svgIcon]="'heroicons_outline:building-library'"></mat-icon>
          <input formControlName="name" placeholder="Nombre de la cuenta" class="w-full border-0 bg-transparent outline-none placeholder:text-ink-3" />
        </label>
      </div>
      <div>
        <label class="mb-1.5 block text-[12.5px] font-semibold text-ink-2">Saldo inicial *</label>
        <label
          class="flex h-10 items-center gap-1 rounded-field border border-line-strong bg-surface px-3 text-[14px] text-ink focus-within:border-brand focus-within:ring-[3px] focus-within:ring-brand/15">
          <span class="text-ink-3">$</span>
          <input
            type="number"
            step="0.01"
            formControlName="currentAmount"
            placeholder="0.00"
            class="w-full border-0 bg-transparent text-right outline-none tabular-nums placeholder:text-ink-3" />
        </label>
      </div>
    </div>

    <div>
      <label class="mb-1.5 block text-[12.5px] font-semibold text-ink-2">Color *</label>
      <mg-color-swatches [value]="selectedColor()" (valueChange)="selectColor($event)"></mg-color-swatches>
    </div>

    <!-- Preview -->
    <div class="flex flex-col gap-2.5 rounded-xl border border-dashed border-line-strong bg-ink/[.015] px-3.5 py-3">
      <span class="text-[10.5px] font-bold uppercase tracking-[.07em] text-ink-3">Vista previa</span>
      <div class="flex items-center gap-2.5">
        <mg-tile size="sm" [color]="selectedColor()">
          <mat-icon class="text-current" [svgIcon]="'heroicons_outline:building-library'"></mat-icon>
        </mg-tile>
        <div class="min-w-0">
          <div class="truncate text-[13.5px] font-semibold text-ink">{{ previewName() }}</div>
          <div class="text-[12px] text-ink-3">Cuenta</div>
        </div>
        <div class="ml-auto text-[13.5px] font-bold tabular-nums">
          {{ previewAmount() | currency: 'MXN' : 'symbol-narrow' }}
        </div>
      </div>
    </div>
  </form>

  <ng-container mgModalActions>
    <button mat-stroked-button type="button" (click)="onCancel()">Cancelar</button>
    <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="formInvalid() || isSubmitting()">
      @if (isSubmitting()) {
        <mat-progress-spinner [diameter]="18" [mode]="'indeterminate'"></mat-progress-spinner>
      } @else {
        {{ isEditMode() ? 'Actualizar' : 'Crear' }}
      }
    </button>
  </ng-container>
</mg-modal-shell>
