<div class="flex min-h-14 flex-none items-center gap-3 bg-brand px-5 text-white">
  <div>
    <div class="text-[15.5px] font-semibold leading-tight">{{ title() }}</div>
    @if (subtitle) {
      <div class="mt-px text-[12px] text-white/65">{{ subtitle }}</div>
    }
  </div>
  <button
    type="button"
    aria-label="Cerrar"
    class="ml-auto grid h-[34px] w-[34px] flex-none place-items-center rounded-[9px] text-white/80 hover:bg-white/10 hover:text-white"
    (click)="closed.emit()">
    <mat-icon class="text-current icon-size-5" svgIcon="heroicons_outline:x-mark"></mat-icon>
  </button>
</div>

<div class="min-h-0 grow overflow-auto">
  <ng-content></ng-content>
</div>

@if (footer()) {
  <div class="flex flex-none items-center gap-2.5 border-t border-line px-5 py-3.5">
    <ng-content select="[mgModalInfo]"></ng-content>
    <div class="ml-auto flex items-center gap-2.5">
      <ng-content select="[mgModalActions]"></ng-content>
    </div>
  </div>
}
