@if (!noIcon()) {
  <mg-tile [color]="color()">
    @if (icon) {
      <mat-icon class="text-current" [svgIcon]="icon"></mat-icon>
    }
  </mg-tile>
}

<div class="min-w-0">
  <div class="text-[14px] font-semibold text-ink truncate">
    @if (rid) {
      <span class="relative -top-px mr-2 font-mono text-[11.5px] font-medium tracking-[.02em] text-ink-3">{{ rid }}</span>
    }
    {{ title() }}
  </div>
  <div class="mt-0.5 flex flex-wrap items-center gap-1.5 text-[12.5px] text-ink-3">
    <ng-content select="[mgRowMeta]"></ng-content>
  </div>
</div>

<div class="flex items-center gap-2">
  <div class="text-right">
    <div
      class="text-[14.5px] font-bold tabular-nums"
      [class.text-teal]="amountTone() === 'in'"
      [class.text-ink]="amountTone() !== 'in'">
      {{ amount() }}
    </div>
    @if (amountMeta) {
      <div class="mt-0.5 text-[11.5px] font-medium text-ink-3 tabular-nums">{{ amountMeta }}</div>
    }
  </div>
  <ng-content select="[mgRowActions]"></ng-content>
</div>
