<div class="flex items-center gap-2.5 px-5 pb-3.5 pt-4">
  <h2 class="text-[15px] font-semibold text-ink">Distribución</h2>
  <span class="ml-auto text-[11px] font-semibold uppercase tracking-[.06em] text-ink-3">{{ dateLabel }}</span>
</div>

<div class="flex flex-col gap-3.5 px-5 pb-5 pt-1">
  @for (cat of categories(); track cat.name) {
    <div>
      <div class="mb-1.5 flex items-center justify-between text-[13px]">
        <span class="text-ink">{{ cat.name }}</span>
        <b class="font-semibold text-ink tabular-nums">{{ formatCurrency(cat.amount) }}</b>
      </div>
      <div class="h-1.5 overflow-hidden rounded-full bg-ink/[.06]">
        <div
          class="h-full rounded-full"
          [style.width.%]="cat.barWidth"
          [style.background-color]="cat.color">
        </div>
      </div>
    </div>
  } @empty {
    <div class="pb-4 text-[13px] text-ink-3">Sin datos en el período.</div>
  }
</div>
