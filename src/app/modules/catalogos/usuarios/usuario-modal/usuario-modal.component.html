<mg-modal-shell [title]="title()" [footer]="true" (closed)="closeDialog()">
  <form class="flex flex-col gap-3.5 p-5" [formGroup]="form">
    <div class="grid grid-cols-2 gap-2.5">
      <div>
        <label class="mb-1.5 block text-[12.5px] font-semibold text-ink-2">Usuario *</label>
        <label
          class="flex h-10 items-center rounded-field border border-line-strong bg-surface px-3 text-[14px] text-ink focus-within:border-brand focus-within:ring-[3px] focus-within:ring-brand/15">
          <input formControlName="username" placeholder="usuario"
            class="w-full border-0 bg-transparent outline-none placeholder:text-ink-3" />
        </label>
        @if (showError('username')) {
          <div class="mt-1 text-[12.5px] text-rose">El usuario es obligatorio</div>
        }
      </div>
      <div>
        <label class="mb-1.5 block text-[12.5px] font-semibold text-ink-2">Email *</label>
        <label
          class="flex h-10 items-center rounded-field border border-line-strong bg-surface px-3 text-[14px] text-ink focus-within:border-brand focus-within:ring-[3px] focus-within:ring-brand/15">
          <input type="email" formControlName="email" placeholder="correo@ejemplo.com"
            class="w-full border-0 bg-transparent outline-none placeholder:text-ink-3" />
        </label>
        @if (showError('email')) {
          <div class="mt-1 text-[12.5px] text-rose">Ingresa un email válido</div>
        }
      </div>
    </div>

    <div>
      <label class="mb-1.5 block text-[12.5px] font-semibold text-ink-2">Nombre *</label>
      <label
        class="flex h-10 items-center rounded-field border border-line-strong bg-surface px-3 text-[14px] text-ink focus-within:border-brand focus-within:ring-[3px] focus-within:ring-brand/15">
        <input formControlName="fullname" placeholder="Nombre completo"
          class="w-full border-0 bg-transparent outline-none placeholder:text-ink-3" />
      </label>
      @if (showError('fullname')) {
        <div class="mt-1 text-[12.5px] text-rose">El nombre es obligatorio</div>
      }
    </div>

    @if (!isEditMode()) {
      <div>
        <label class="mb-1.5 block text-[12.5px] font-semibold text-ink-2">Contraseña</label>
        <label
          class="flex h-10 items-center rounded-field border border-line-strong bg-surface px-3 text-[14px] text-ink focus-within:border-brand focus-within:ring-[3px] focus-within:ring-brand/15">
          <input type="password" formControlName="password" placeholder="••••••••" autocomplete="new-password"
            class="w-full border-0 bg-transparent outline-none placeholder:text-ink-3" />
        </label>
      </div>
    }

    <div>
      <label class="mb-1.5 block text-[12.5px] font-semibold text-ink-2">Rol</label>
      <div class="grid grid-cols-3 gap-x-3 gap-y-1.5">
        @for (role of roleOptions; track role.value) {
          <label class="flex cursor-pointer items-center gap-2 text-[13px] text-ink">
            <input type="checkbox" class="accent-brand" [checked]="isRoleSelected(role.value)"
              (change)="toggleRole(role.value)" />
            <span class="truncate">{{ role.label }}</span>
          </label>
        }
      </div>
    </div>
  </form>

  <ng-container mgModalActions>
    <button type="button" mat-stroked-button (click)="closeDialog()">Cancelar</button>
    <button mat-flat-button [color]="'primary'" [disabled]="formDisabled()" (click)="save()">
      @if (!formDisabled()) {
        <span>Guardar</span>
      } @else {
        <mat-progress-spinner [diameter]="24" [mode]="'indeterminate'"></mat-progress-spinner>
      }
    </button>
  </ng-container>
</mg-modal-shell>
