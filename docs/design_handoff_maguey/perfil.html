<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi perfil — Maguey 2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/maguey.css">
<style>
  .layout{ display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; max-width:960px; }
  .avatar-lg{
    width:64px; height:64px; border-radius:999px; background:var(--brand); color:var(--gold);
    display:grid; place-items:center; font-size:22px; font-weight:700; flex:none;
  }
  .idrow{ display:flex; align-items:center; gap:16px; padding:20px; }
  .idrow .em{ font-size:14px; font-weight:600; }
  .idrow .since{ font-size:12.5px; color:var(--ink-3); margin-top:2px; }
  .kv{ padding:14px 20px; border-top:1px solid var(--line); }
  .kv .mg-kicker{ display:block; margin-bottom:8px; }
  .roles{ display:flex; gap:8px; flex-wrap:wrap; }
  .form{ padding:20px; display:flex; flex-direction:column; gap:14px; }
  .form .actions{ display:flex; justify-content:flex-end; padding-top:4px; }

  /* Menú de usuario del topbar (estado abierto) */
  .usermenu{
    position:absolute; top:54px; right:16px; z-index:60; width:250px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow-overlay); overflow:hidden;
  }
  .usermenu .head{ display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .usermenu .head .em{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; }
  .usermenu .head .r{ font-size:11.5px; color:var(--ink-3); }
  .usermenu a{ display:flex; align-items:center; gap:10px; padding:11px 16px; font-size:13.5px; font-weight:500; }
  .usermenu a svg{ width:17px; height:17px; color:var(--ink-3); }
  .usermenu a:hover{ background:var(--brand-tint); }
  .usermenu a.out{ color:var(--rose); border-top:1px solid var(--line); }
  .usermenu a.out svg{ color:var(--rose); }
  .avatar-sm{
    width:36px; height:36px; border-radius:999px; background:var(--brand); color:var(--gold);
    display:grid; place-items:center; font-size:13px; font-weight:700; flex:none;
  }
</style>
</head>
<body class="depth-a">
<div class="mg-shell">
  <aside class="mg-side" data-shell="admin"></aside>
  <div class="mg-main">
    <div style="position:relative;">
      <div data-topbar></div>
      <!-- Menú de usuario abierto: mismo lenguaje de card/overlay -->
      <div class="usermenu">
        <div class="head">
          <span class="avatar-sm">JB</span>
          <div style="min-width:0;">
            <div class="em">Joel Barranco</div>
            <div class="r">hello@joelbarranco.io · Administrador</div>
          </div>
        </div>
        <a href="#"><i data-i="user"></i>Ver perfil</a>
        <a href="#" class="out"><i data-i="x"></i>Cerrar sesión</a>
      </div>
    </div>
    <div class="mg-page">

      <div class="mg-pagehead">
        <div>
          <h1>Mi perfil</h1>
          <div class="sub">Cuenta y seguridad</div>
        </div>
      </div>

      <div class="layout">
        <!-- Cuenta -->
        <div class="mg-card">
          <div class="idrow">
            <span class="avatar-lg">JB</span>
            <div>
              <div class="em">Joel Barranco</div>
              <div class="since">hello@joelbarranco.io · Miembro desde marzo 2024</div>
            </div>
          </div>
          <div class="kv">
            <span class="mg-kicker">Roles</span>
            <!-- Un rol = una pill completa (hoy se parte en letras sueltas) -->
            <div class="roles">
              <span class="mg-pill brand">Administrador</span>
              <span class="mg-pill neutral">Premium</span>
            </div>
          </div>
          <div class="kv">
            <span class="mg-kicker">Hogar</span>
            <div style="display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:500;">
              Hogar Barranco <span class="mg-pill brand sm">Dueño</span>
            </div>
          </div>
        </div>

        <!-- Seguridad -->
        <div class="mg-card">
          <div class="mg-cardhead" style="padding-bottom:0;"><h2>Cambiar contraseña</h2></div>
          <div class="form">
            <div><label class="mg-label">Contraseña actual *</label><label class="mg-field"><i data-i="lock"></i><input type="password" placeholder="••••••••"></label></div>
            <div><label class="mg-label">Nueva contraseña *</label><label class="mg-field"><i data-i="lock"></i><input type="password" placeholder="Mínimo 8 caracteres"></label></div>
            <div><label class="mg-label">Confirmar nueva contraseña *</label><label class="mg-field"><i data-i="lock"></i><input type="password" placeholder="Repite la contraseña"></label></div>
            <div class="actions">
              <button class="mg-btn primary" disabled>Actualizar contraseña</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
<script src="shared/shell.js"></script>
</body>
</html>
