<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrar ingreso · Escanear recibo — Maguey 2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/maguey.css">
<style>
  body{ overflow:hidden; background:var(--canvas); }
  .stage{ min-height:100vh; display:flex; align-items:flex-start; justify-content:center; gap:32px; padding:40px; background:rgb(23 32 27/.45); }
  .slot{ display:flex; flex-direction:column; gap:10px; }
  .slot > .cap{ font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:#fff; opacity:.85; }
  .form{ padding:20px; display:flex; flex-direction:column; gap:14px; }
  .frow2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .amount input{ font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .amount{ height:56px; border-radius:12px; }

  /* Dropzone de escaneo */
  .drop{
    border:1.5px dashed var(--line-strong); border-radius:14px; padding:36px 24px;
    display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;
    background:color-mix(in srgb, var(--ink) 1.5%, var(--card));
  }
  .drop .cir{ width:56px; height:56px; border-radius:999px; background:var(--brand-tint); color:var(--brand); display:grid; place-items:center; margin-bottom:4px; }
  .drop .cir svg{ width:26px; height:26px; }
  .drop h3{ font-size:14px; font-weight:600; }
  .drop p{ font-size:12.5px; color:var(--ink-3); margin:0; }
</style>
</head>
<body class="depth-a">

<div class="stage">

  <!-- REGISTRAR INGRESO -->
  <div class="slot">
    <span class="cap">Registrar ingreso · desde Ingresos</span>
    <div class="mg-modal" style="width:460px;">
      <div class="mg-modalhead">
        <div><div class="t">Registrar ingreso</div></div>
        <button class="x"><i data-i="x"></i></button>
      </div>
      <div class="form">
        <div class="frow2">
          <div><label class="mg-label">Cuenta *</label>
            <label class="mg-field"><span class="pdot" style="width:8px;height:8px;border-radius:999px;background:#A64F4F;"></span><input value="Scotiabank"><i data-i="chevD" class="chev"></i></label>
          </div>
          <div><label class="mg-label">Concepto *</label>
            <label class="mg-field"><input value="Nómina"><i data-i="chevD" class="chev"></i></label>
          </div>
        </div>
        <div class="frow2">
          <div><label class="mg-label">Fecha *</label><label class="mg-field"><input value="02 julio, 2026"><i data-i="cal" class="chev"></i></label></div>
          <div><label class="mg-label">Hora *</label><label class="mg-field"><input value="02:27 PM"></label></div>
        </div>
        <div>
          <label class="mg-label">Cantidad *</label>
          <label class="mg-field amount"><input value="$45,222.00" style="text-align:center; color:var(--teal);"></label>
        </div>
        <div><label class="mg-label">Comentarios</label>
          <label class="mg-field" style="height:auto;"><textarea rows="2" style="border:0; outline:0; background:none; font:inherit; color:inherit; width:100%; resize:none; padding:10px 0;" placeholder="Opcional"></textarea></label>
        </div>
      </div>
      <div class="mg-modalfoot">
        <div>
          <span class="mg-kicker">Total</span>
          <div class="num amt-in" style="font-size:20px; font-weight:700;">+$45,222.00</div>
        </div>
        <div class="actions">
          <button class="mg-btn secondary">Cancelar</button>
          <button class="mg-btn primary">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ESCANEAR RECIBO -->
  <div class="slot">
    <span class="cap">Escanear recibo · desde Gastos</span>
    <div class="mg-modal" style="width:440px;">
      <div class="mg-modalhead">
        <div>
          <div class="t">Escanear recibo</div>
          <div class="s">La IA extrae los artículos y abre Revisar Recibo</div>
        </div>
        <button class="x"><i data-i="x"></i></button>
      </div>
      <div class="form">
        <div class="drop">
          <div class="cir"><i data-i="doc"></i></div>
          <h3>Arrastra el recibo aquí</h3>
          <p>o toma una foto · JPG, PNG o PDF · hasta 10 MB</p>
        </div>
        <button class="mg-btn primary" style="width:100%; justify-content:center;"><i data-i="cam"></i>Abrir cámara</button>
        <button class="mg-btn secondary" style="width:100%; justify-content:center;"><i data-i="doc"></i>Elegir de galería</button>
      </div>
    </div>
  </div>

</div>
<script src="shared/shell.js"></script>
</body>
</html>
