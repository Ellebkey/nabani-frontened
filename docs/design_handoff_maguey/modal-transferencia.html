<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modal Transferencia — Maguey 2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/maguey.css">
<style>
  body{ overflow:hidden; }
  .bg-dim{ position:fixed; inset:0; background:var(--canvas); }
  .form{ padding:20px; display:flex; flex-direction:column; gap:14px; }

  /* Selector de cuenta: la fila de cuenta estándar DENTRO de un campo */
  .accfield{
    border:1px solid var(--line-strong); border-radius:12px; background:var(--card);
    display:flex; align-items:center; gap:12px; padding:10px 14px; width:100%; text-align:left;
  }
  .accfield:hover{ border-color:var(--brand); }
  .accfield .nm{ font-size:14px; font-weight:600; }
  .accfield .bal{ font-size:12.5px; color:var(--ink-3); }
  .accfield > svg{ width:16px; height:16px; color:var(--ink-3); margin-left:auto; }

  .swaprow{ display:flex; justify-content:center; margin:-6px 0; position:relative; z-index:2; }
  .swapbtn{
    width:36px; height:36px; border-radius:999px; background:var(--card);
    border:1px solid var(--line-strong); display:grid; place-items:center; color:var(--brand);
  }
  .swapbtn:hover{ background:var(--brand-tint); }
  .swapbtn svg{ width:17px; height:17px; transform:rotate(90deg); }

  .frow2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .amount input{ font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .amount{ height:56px; border-radius:12px; }

  /* Resultado previsto */
  .preview{ border:1px dashed var(--line-strong); border-radius:12px; padding:12px 16px; display:flex; flex-direction:column; gap:8px; background:color-mix(in srgb, var(--ink) 1.5%, var(--card)); }
  .preview .pr{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-2); }
  .preview .pr b{ font-variant-numeric:tabular-nums; font-weight:600; color:var(--ink); }
  .preview .pr .arr{ color:var(--ink-3); }
</style>
</head>
<body class="depth-a">
<div class="bg-dim"></div>

<div class="mg-scrim">
  <div class="mg-modal" style="max-width:480px;">
    <div class="mg-modalhead">
      <div><div class="t">Transferir entre cuentas</div></div>
      <button class="x"><i data-i="x"></i></button>
    </div>

    <div class="mg-modalbody">
      <div class="form">
        <div>
          <label class="mg-label">Desde *</label>
          <button class="accfield">
            <div class="mg-tile sm" style="--tc:#3B5F82"><i data-i="bank"></i></div>
            <div><div class="nm">BBVA</div><div class="bal num">Saldo $11,397.43</div></div>
            <i data-i="chevD"></i>
          </button>
        </div>

        <div class="swaprow">
          <button class="swapbtn" title="Intercambiar"><i data-i="swap"></i></button>
        </div>

        <div>
          <label class="mg-label">Hacia *</label>
          <button class="accfield">
            <div class="mg-tile sm" style="--tc:#4E8A6A"><i data-i="cash"></i></div>
            <div><div class="nm">Efectivo</div><div class="bal num">Saldo $8,829.00</div></div>
            <i data-i="chevD"></i>
          </button>
        </div>

        <div>
          <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px;">
            <label class="mg-label" style="margin:0;">Monto *</label>
            <button style="font-size:12.5px; font-weight:600; color:var(--brand);" class="num" title="Usar todo el saldo disponible">Transferir todo · $11,397.43</button>
          </div>
          <label class="mg-field amount"><input value="$5,000.00" style="text-align:center;"></label>
        </div>

        <div class="frow2">
          <div><label class="mg-label">Fecha *</label><label class="mg-field"><input value="02 julio, 2026"><i data-i="cal" class="chev"></i></label></div>
          <div><label class="mg-label">Hora *</label><label class="mg-field"><input value="02:15 PM"></label></div>
        </div>

        <div><label class="mg-label">Comentarios</label><label class="mg-field"><input placeholder="Opcional"></label></div>

        <div class="preview">
          <div class="pr"><span class="pdot" style="width:7px;height:7px;border-radius:999px;background:#3B5F82;"></span>BBVA <b class="num">$11,397.43</b> <span class="arr">→</span> <b class="num">$6,397.43</b></div>
          <div class="pr"><span class="pdot" style="width:7px;height:7px;border-radius:999px;background:#4E8A6A;"></span>Efectivo <b class="num">$8,829.00</b> <span class="arr">→</span> <b class="num">$13,829.00</b></div>
        </div>
      </div>
    </div>

    <div class="mg-modalfoot">
      <div class="actions" style="width:100%; justify-content:flex-end;">
        <button class="mg-btn secondary">Cancelar</button>
        <button class="mg-btn primary"><i data-i="swap"></i>Transferir</button>
      </div>
    </div>
  </div>
</div>
<script src="shared/shell.js"></script>
</body>
</html>
