<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borradores — popover del topbar — Maguey 2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/maguey.css">
<style>
  body{ overflow:hidden; background:var(--canvas); }
  .stage{ min-height:100vh; display:flex; align-items:flex-start; justify-content:center; gap:32px; padding:40px; background:rgb(23 32 27/.45); }
  .slot{ display:flex; flex-direction:column; gap:10px; }
  .slot > .cap{ font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:#fff; opacity:.85; }

  /* Popover del topbar: misma anatomía que el menú de usuario y buscar/crear —
     card + sombra overlay, SIN header verde (reservado a modales de página) */
  .pop{
    width:380px; background:var(--card); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow-overlay); overflow:hidden;
  }
  .phead{ display:flex; align-items:center; gap:8px; padding:14px 16px 10px; }
  .phead h3{ font-size:14px; font-weight:600; }
  .phead .mg-pill{ margin-left:6px; }

  .grouplbl{
    padding:0 16px 8px; font-size:11px; font-weight:700; letter-spacing:.07em;
    text-transform:uppercase; color:var(--ink-3);
  }

  .draft{ display:flex; align-items:center; gap:12px; padding:11px 16px; width:100%; text-align:left; border-top:1px solid var(--line); }
  .draft:hover{ background:var(--brand-tint); }
  .draft .nm{ font-size:13.5px; font-weight:600; }
  .draft .meta{ font-size:12px; color:var(--ink-3); margin-top:1px; display:flex; align-items:center; gap:5px; }
  .draft .amt{ margin-left:auto; font-size:13.5px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink); }
  .draft .amt .st{ display:block; font-size:11px; font-weight:600; text-align:right; margin-top:1px; }
  .draft.old .meta .age{ color:var(--amber); font-weight:600; }

  .pfoot{ border-top:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; }
  .pfoot button{ font-size:12.5px; font-weight:600; color:var(--brand); padding:4px 8px; border-radius:7px; }
  .pfoot button:hover{ background:var(--brand-tint); }
</style>
</head>
<body class="depth-a">

<div class="stage">
  <div class="slot">
    <span class="cap">Borradores · popover del ícono de notificaciones del topbar</span>
    <div class="pop">
      <div class="phead">
        <h3>Borradores</h3>
        <span class="mg-pill amber sm">4 por revisar</span>
      </div>
      <div class="grouplbl">Recibos por revisar</div>

      <button class="draft">
        <div class="mg-tile sm neutral"><i data-i="doc"></i></div>
        <div>
          <div class="nm">Aliexpress</div>
          <div class="meta">11 artículos · <span class="age">30 jun 2026</span></div>
        </div>
        <div class="amt num">$1,861.04<span class="st" style="color:var(--teal)">9 de 11 ✓</span></div>
      </button>

      <button class="draft old">
        <div class="mg-tile sm neutral"><i data-i="doc"></i></div>
        <div>
          <div class="nm">Costco</div>
          <div class="meta">17 artículos · <span class="age">10 ago 2024</span></div>
        </div>
        <div class="amt num">$2,306.87<span class="st" style="color:var(--ink-3)">sin revisar</span></div>
      </button>

      <button class="draft old">
        <div class="mg-tile sm neutral"><i data-i="doc"></i></div>
        <div>
          <div class="nm">Sam's Club</div>
          <div class="meta">5 artículos · <span class="age">5 ago 2023</span></div>
        </div>
        <div class="amt num">$121.74<span class="st" style="color:var(--ink-3)">sin revisar</span></div>
      </button>

      <button class="draft">
        <div class="mg-tile sm neutral"><i data-i="doc"></i></div>
        <div>
          <div class="nm">Telcel</div>
          <div class="meta">1 artículo · 28 jun 2026</div>
        </div>
        <div class="amt num">$200.00<span class="st" style="color:var(--ink-3)">sin revisar</span></div>
      </button>

      <div class="pfoot">
        <button>Escanear otro recibo</button>
        <span style="margin-left:auto"></span>
        <button style="color:var(--ink-3)">Ver todos</button>
      </div>
    </div>
  </div>
</div>
<script src="shared/shell.js"></script>
</body>
</html>
